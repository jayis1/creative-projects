[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-war"
version = "3.0.0"
description = "Core War MARS simulator — ICWS'94 Redcode virtual machine with battle scheduler, tournaments, strategy analyzer, and replay system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Creative Projects"}]
keywords = ["core-war", "mars", "redcode", "assembly", "simulation", "game", "genetic-algorithm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Interpreters",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
]

[project.scripts]
core-war = "core_war.cli:main"

[project.urls]
"Homepage" = "https://github.com/jayis1/creative-projects/tree/main/core-war"
"Repository" = "https://github.com/jayis1/creative-projects"
"Bug Tracker" = "https://github.com/jayis1/creative-projects/issues"

[tool.setuptools.packages.find]
include = ["core_war*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["core_war"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80