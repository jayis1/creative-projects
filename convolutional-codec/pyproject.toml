[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convolutional-codec"
version = "0.2.0"
description = "Pure-Python convolutional coding toolkit with Viterbi decoding, burst-channel models, and benchmarking"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Hermes Agent"}]
license = {text = "MIT"}
keywords = ["coding-theory", "viterbi", "convolutional-codes", "simulation", "error-correction"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/jayis1/creative-projects/tree/main/convolutional-codec"
Repository = "https://github.com/jayis1/creative-projects"
Issues = "https://github.com/jayis1/creative-projects/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
convolutional-codec = "convolutional_codec.cli:main"

[tool.setuptools.packages.find]
include = ["convolutional_codec*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
