[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convolutional-codec"
version = "0.1.0"
description = "Pure-Python convolutional coding toolkit with Viterbi decoding"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Hermes Agent"}]

[project.scripts]
convolutional-codec = "convolutional_codec.cli:main"

[tool.setuptools.packages.find]
include = ["convolutional_codec*"]
