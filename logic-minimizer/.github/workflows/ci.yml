name: CI

on:
  push:
    paths:
      - 'logic-minimizer/**'
  pull_request:
    paths:
      - 'logic-minimizer/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          cd logic-minimizer
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          cd logic-minimizer
          python -m pytest tests/ -v --tb=short
      - name: Test CLI
        run: |
          cd logic-minimizer
          python -m logicmin.cli version
          python -m logicmin.cli minimize -n 4 -m "4 8 10 11 12 15 d: 9 14"
          python -m logicmin.cli espresso -n 4 -m "4 8 10 11 12 15 d: 9 14"
          python -m logicmin.cli pos -n 4 -m "4 8 10 11 12 15 d: 9 14"
          python -m logicmin.cli bdd -n 3 -m "1 3 5 7" --count
          python -m logicmin.cli sensitivity -n 3 -m "1 3 5 7"
          python -m logicmin.cli unate -n 2 -m "2 3"
          python -m logicmin.cli kmap -n 4 -m "4 8 10 11 12 15 d: 9 14" --cover
          python -m logicmin.cli truth -n 2 -m "1 2"
          python -m logicmin.cli factor "AB'C + AC + BC'"
          python -m logicmin.cli benchmark -n 4 -t 3 --seed 42