[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logicmin"
version = "1.0.0"
description = "Boolean logic minimization toolkit: Quine-McCluskey, Petrick's method, Espresso, multi-output, factorization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "creative-projects"}]
keywords = ["boolean", "logic", "minimization", "quine-mccluskey", "espresso", "petrick"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.scripts]
logicmin = "logicmin.cli:main"

[tool.setuptools.packages.find]
include = ["logicmin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]