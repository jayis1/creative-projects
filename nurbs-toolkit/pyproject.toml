[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nurbs-toolkit"
version = "3.0.0"
description = "Pure-Python NURBS & B-spline CAGD toolkit — curves, surfaces, fitting, curvature, offset, trimming, STL export, CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "creative-projects"}]
keywords = ["nurbs", "bspline", "bezier", "cagd", "cad", "geometry", "splines"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
toml = ["tomli>=1.2; python_version < '3.11'"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
nurbs = "nurbs.cli:main"

[tool.setuptools.packages.find]
include = ["nurbs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]