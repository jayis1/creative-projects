name: CI

on:
  push:
    paths:
      - 'logic-minimizer/**'
  pull_request:
    paths:
      - 'logic-minimizer/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: logic-minimizer
        run: pip install -e .
      - name: Run tests
        working-directory: logic-minimizer
        run: python -m pytest tests/ -v