name: CI

on:
  push:
    paths:
      - 'matrix-decomp/**'
  pull_request:
    paths:
      - 'matrix-decomp/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e ./matrix-decomp

      - name: Run tests
        working-directory: matrix-decomp
        run: python -m pytest tests/ -v --tb=short

      - name: Run examples (smoke test)
        working-directory: matrix-decomp
        run: |
          python examples/demo.py || true
          python examples/demo_iterative.py || true
          python examples/demo_pca.py || true
          python examples/demo_sparse.py || true

      - name: CLI smoke test
        working-directory: matrix-decomp
        run: |
          matrix-decomp det "[[6,1,1],[4,-2,5],[2,8,7]]"
          matrix-decomp svd "[[1,2],[3,4],[5,6]]"
          matrix-decomp eigen "[[2,1],[1,2]]" --vectors
          matrix-decomp bench 4 --seed 42