[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "matrix-decomp"
version = "3.0.0"
description = "From-scratch matrix decomposition & linear algebra library (pure Python, no NumPy)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "creative-projects"}]
keywords = ["linear-algebra", "matrix", "decomposition", "svd", "lu", "qr", "eigenvalues", "pca", "sparse", "pure-python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
matrix-decomp = "matrix_decomp.cli:main"

[project.urls]
"Homepage" = "https://github.com/jayis1/creative-projects/tree/main/matrix-decomp"
"Bug Tracker" = "https://github.com/jayis1/creative-projects/issues"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["matrix_decomp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]