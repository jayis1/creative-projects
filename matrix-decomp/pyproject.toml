[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "matrix-decomp"
version = "1.0.0"
description = "From-scratch matrix decomposition & linear algebra library (pure Python, no NumPy)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "creative-projects"}]

[project.scripts]
matrix-decomp = "matrix_decomp.cli:main"

[tool.setuptools.packages.find]
include = ["matrix_decomp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]