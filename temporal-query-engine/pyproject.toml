[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-query-engine"
version = "0.2.0"
description = "A dependency-free indexed interval query engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "jayis1"}]
license = {file = "LICENSE"}

[project.scripts]
temporal-query = "temporal_query.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
