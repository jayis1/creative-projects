[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stitch-planner"
version = "1.0.0"
description = "Plan running stitches from tiny monochrome raster masks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "jayis1" }]
license = { file = "LICENSE" }

[project.scripts]
stitch-planner = "stitch_planner:main"

[tool.setuptools]
py-modules = ["stitch_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
