[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tda"
version = "1.0.0"
description = "Topological Data Analysis toolkit: persistent homology, persistence diagrams, bottleneck distances"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "creative-projects"}]
keywords = ["topology", "persistent-homology", "tda", "vietoris-rips", "persistence-diagrams"]

[project.scripts]
tda = "tda.cli:main"

[tool.setuptools.packages.find]
include = ["tda*"]