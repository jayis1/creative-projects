[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bpe-tokenizer"
version = "3.0.0"
description = "From-scratch Byte Pair Encoding tokenizer with WordPiece, Unigram/Viterbi, BPE-dropout, config files, and comparison tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "creative-projects"}]
keywords = ["bpe", "tokenizer", "nlp", "byte-pair-encoding", "wordpiece", "sentencepiece", "viterbi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
regex = ["regex>=2024.0.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
bpe-tokenizer = "bpe_tokenizer.cli:main"

[tool.setuptools.packages.find]
include = ["bpe_tokenizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]