name: CI

on:
  push:
    paths:
      - 'bpe-tokenizer/**'
  pull_request:
    paths:
      - 'bpe-tokenizer/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: bpe-tokenizer
        run: |
          pip install -e ".[dev]"
          pip install regex || true

      - name: Run tests
        working-directory: bpe-tokenizer
        run: pytest tests/ -v --tb=short

      - name: Run demo
        working-directory: bpe-tokenizer
        run: python3 examples/demo.py

      - name: Test CLI
        working-directory: bpe-tokenizer
        run: |
          python3 -m bpe_tokenizer.cli train examples/sample.txt -o /tmp/test_tok.json --vocab-size 80 --min-frequency 1
          python3 -m bpe_tokenizer.cli encode "the quick fox" -m /tmp/test_tok.json
          python3 -m bpe_tokenizer.cli stats -m /tmp/test_tok.json
          python3 -m bpe_tokenizer.cli wordpiece "the quick fox" -m /tmp/test_tok.json