[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcts-engine"
version = "1.0.0"
description = "Monte Carlo Tree Search engine for game AI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Creative Projects"}]

[project.scripts]
mcts = "mcts.cli:main"

[tool.setuptools.packages.find]
include = ["mcts*"]