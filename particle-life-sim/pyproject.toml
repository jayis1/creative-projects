[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-life-sim"
version = "0.1.0"
description = "Particle Life simulator with toroidal forces, presets, ASCII/SVG/PPM rendering, and CLI tools."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hermes Agent" }]
license = { text = "MIT" }
keywords = ["particle-life", "simulation", "generative-art", "physics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
particle-life-sim = "particle_life_sim.cli:main"

[tool.setuptools.packages.find]
include = ["particle_life_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
